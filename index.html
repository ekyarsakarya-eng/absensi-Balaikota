<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#991b1b">
  <meta name="description" content="Aplikasi Absensi Karyawan Balaikota">
  <title>Absensi Balaikota</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#991b1b', // red-800
          }
        }
      }
    }
  </script>
  
<style>
  @keyframes slideDown {
    from { transform: translateY(-100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
</style>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-512.png">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white transition">

  <div id="app"></div>

  <!-- POPUP INSTALL PWA -->
  <div id="installPopup" class="fixed inset-0 bg-black/90 backdrop-blur-sm hidden items-center justify-center p-4 z-[999]">
    <div class="bg-white dark:bg-gray-800 rounded-3xl p-6 w-full max-w-sm text-center shadow-2xl">
      <div class="w-20 h-20 bg-red-800 rounded-3xl mx-auto flex items-center justify-center mb-4 animate-bounce">
        <i class="fa-solid fa-download text-white text-3xl"></i>
      </div>
      <h3 class="text-xl font-black text-gray-900 dark:text-white mb-2">Install Aplikasi</h3>
      <p class="text-sm text-gray-600 dark:text-gray-400 mb-6">Install aplikasi untuk pengalaman yang lebih baik dan akses cepat.</p>
      <button id="btnInstallAndroid" class="w-full bg-red-800 hover:bg-red-900 text-white py-4 rounded-2xl font-bold text-lg shadow-xl transition">
        <i class="fa-solid fa-download mr-2"></i>Install Sekarang
      </button>
      <button id="btnIOS" class="hidden w-full bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-white py-4 rounded-2xl font-bold text-lg shadow-xl transition mt-3">
        <i class="fa-solid fa-share-from-square mr-2"></i>Lihat Cara Install (iOS)
      </button>
      <div id="iosSteps" class="hidden text-left text-sm text-gray-600 dark:text-gray-400 mt-4 space-y-2 bg-gray-50 dark:bg-gray-700 p-3 rounded-xl">
        <p>1. Klik tombol <i class="fa-solid fa-share-from-square"></i> Share di bawah</p>
        <p>2. Pilih <b>"Tambah ke Layar Utama"</b> (Add to Home Screen)</p>
        <p>3. Klik <b>"Tambah"</b> di pojok kanan atas</p>
      </div>
      <p class="text-xs text-gray-500 mt-4">Gratis • Ringan • Cepat</p>
    </div>
  </div>

  <!-- Modal Zoom -->
  <div id="modalZoom" class="fixed inset-0 bg-black/90 hidden items-center justify-center p-4 z-[9999]" onclick="tutupZoom()">
    <button class="absolute top-5 right-5 w-11 h-11 bg-white/20 hover:bg-white/30 rounded-full text-white text-3xl transition flex items-center justify-center">&times;</button>
    <img id="imgZoom" class="max-w-full max-h-[90vh] rounded-2xl shadow-2xl" onclick="event.stopPropagation()">
  </div>

  <script>
    function bukaZoom(url) {
      document.getElementById('imgZoom').src = url;
      document.getElementById('modalZoom').classList.remove('hidden');
      document.getElementById('modalZoom').classList.add('flex');
    }
    function tutupZoom() {
      document.getElementById('modalZoom').classList.add('hidden');
      document.getElementById('modalZoom').classList.remove('flex');
    }
  </script>

  <!-- Load app.js -->
  <script src="./app.js"></script>
</body>
</html>
